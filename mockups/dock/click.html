<!doctype html>
<html lang="en" data-screens="bounce,squish,ripple,pop,glow,depress">
<head>
<meta charset="utf-8">
<title>Click animations — Nyx Dock mockups</title>
<link rel="stylesheet" href="../bar/tokens.css">
<link rel="stylesheet" href="../bar/bar.css">
<link rel="stylesheet" href="dock.css">
<script src="../bar/parts.js"></script>
<script src="dock.js"></script>
<style>
  /* The live page: tiles answer the pointer (the shots use .hov). */
  .dt { cursor: pointer; user-select: none; -webkit-user-drag: none; }
  .dt img { -webkit-user-drag: none; pointer-events: none; }
  .dt:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .dt:hover .ai { transform: translateY(-2px); }
  /* A close-up of four tiles, so the motion reads at gallery size. */
  .closeup { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .closeup .dock { position: static; transform: none; zoom: 2.5; }
  .closeup .lbl, .reallbl { font-size: 12px; color: var(--dim-text); background: color-mix(in srgb, var(--popover) 80%, transparent); padding: 3px 10px; border-radius: 7px; }
  .reallbl { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); }
  .ring { position: absolute; left: 4px; top: 4px; width: var(--is); height: var(--is); border-radius: 26%; box-shadow: 0 0 0 2px var(--accent); opacity: 0; pointer-events: none; }
  .dt .ind.new u { opacity: 0; }
  .dcap { max-width: 600px; }
  .dcap .try { margin-top: 8px; color: var(--text); font-size: 12.5px; }
</style>
</head>
<body>
<script>
  // Six ways a dock icon can answer a click, each looping on Notes (in a close-up and on the
  // dock itself). Click any icon to try it. ?shot=1&t=<ms> holds the loop at one moment.
  const N = ["ok", "New"];
  const S = {
    bounce: {
      name: "Bounce",
      desc: "The icon hops twice, the second hop lower (620 ms). An app that isn't running yet keeps hopping until its first window opens, then its window mark appears; here Calendar hops three times. It stops after about 5 s if no window comes. As the macOS dock does.",
    },
    squish: {
      name: "Squish",
      desc: "The icon shrinks to 85% while the button is down (110 ms), and springs back past full size to 106% and settles when you let go (380 ms). It answers the press itself, before the app does anything.",
    },
    ripple: {
      name: "Ripple",
      desc: "A ring in the accent color, the icon's shape, spreads out to 1.6× and fades (450 ms). The icon itself doesn't move.",
    },
    pop: {
      name: "Pop",
      desc: "The icon grows to 115% and settles back (260 ms). Short and light; it reads like a tap.",
    },
    glow: {
      name: "Glow",
      desc: "An accent glow flashes behind the icon and fades (500 ms). The same glow an app asking for attention gets, in the accent color and brief.",
    },
    depress: {
      name: "Depress",
      desc: "The icon sinks 3 px and darkens a little while the button is down (80 ms), like pressing a key, and comes back up when you let go (160 ms).",
    },
  };
  const s = S[SCREEN] || S.bounce;
  const closeTiles = ["mail", "calendar", "notes", "music"].map((k) => tile(k, { id: "z-" + k })).join("");
  screen({
    dockHtml: `${dock()}<div class="closeup"><div class="dock a" style="--is:48px">${closeTiles}</div><span class="lbl">Close-up, 2.5×</span></div><span class="reallbl">At real size</span>`,
    caption: { name: `Click: ${s.name}`, rule: N, desc: s.desc + " Nothing moves under Reduce motion." },
  });
  if (!SHOT) document.querySelector(".dcap").insertAdjacentHTML("beforeend", `<div class="try">Click any icon to try it${SCREEN === "bounce" ? "; a pinned app that isn't running shows what launching looks like" : ""}.</div>`);
  // In the gallery's viewer: no switcher, and its keys go back to the gallery.
  if (Q.get("embed") === "1") {
    document.querySelector(".mock-switch")?.remove();
    addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", " ", "Escape", "d", "l"].includes(e.key)) {
        e.preventDefault();
        parent.postMessage({ viewerKey: e.key }, "*");
      }
    });
  }

  /* ── Motion ───────────────────────────────────────────────────────────────── */
  // Keyframes at times in ms (as QML's SequentialAnimation steps), each easing to the next.
  const out = "cubic-bezier(.2,.7,.3,1)", inn = "cubic-bezier(.6,0,.8,.4)", inout = "cubic-bezier(.45,0,.25,1)";
  const run = (el, steps, dur, delay = 0) =>
    el.animate(steps.map(([at, f, easing]) => ({ ...f, offset: at / dur, easing: easing || "linear" })), { duration: dur, delay, fill: "backwards" });
  const accent = (() => {
    const p = document.createElement("i");
    p.style.color = "var(--accent)";
    document.body.append(p);
    const c = getComputedStyle(p).color.match(/[\d.]+/g).slice(0, 3).join(", ");
    p.remove();
    return (a) => `rgba(${c}, ${a})`;
  })();
  const ty = (px) => ({ transform: `translateY(${px}px)` });
  const sc = (z) => ({ transform: `scale(${z})` });
  const dur = (steps) => steps[steps.length - 1][0];

  // Each: on press and release (squish, depress) or once on click; loop() is one press and release.
  const FX = {
    bounce: {
      click: (ai) => [run(ai, [[0, ty(0), out], [200, ty(-14), inn], [380, ty(0), out], [480, ty(-5), inn], [620, ty(0)]], 620)],
    },
    squish: {
      press: [[0, sc(1), out], [110, sc(0.85)]],
      release: [[0, sc(0.85), out], [140, sc(1.06), inout], [260, sc(0.98), inout], [380, sc(1)]],
    },
    ripple: {
      click: (ai, t) => {
        const r = t.querySelector(".ring") || t.appendChild(Object.assign(document.createElement("span"), { className: "ring" }));
        return [run(r, [[0, { transform: "scale(1)" }, "cubic-bezier(.1,.6,.3,1)"], [450, { transform: "scale(1.6)" }]], 450),
          run(r, [[0, { opacity: 1, boxShadow: `0 0 0 3px ${accent(1)}` }], [200, { opacity: 0.9 }, out], [450, { opacity: 0, boxShadow: `0 0 0 1px ${accent(1)}` }]], 450)];
      },
    },
    pop: {
      click: (ai) => [run(ai, [[0, sc(1), out], [90, sc(1.15), inout], [260, sc(1)]], 260)],
    },
    glow: {
      click: (ai) => [run(ai, [[0, { filter: `drop-shadow(0 0 0px ${accent(0)})` }, out], [120, { filter: `drop-shadow(0 0 14px ${accent(0.8)})` }, inout], [500, { filter: `drop-shadow(0 0 0px ${accent(0)})` }]], 500)],
    },
    depress: {
      press: [[0, { ...ty(0), filter: "brightness(1)" }, out], [80, { ...ty(3), filter: "brightness(.8)" }]],
      release: [[0, { ...ty(3), filter: "brightness(.8)" }, out], [160, { ...ty(0), filter: "brightness(1)" }]],
    },
  };
  const fx = FX[SCREEN] || FX.bounce;
  const HOLD = 150;

  // Launching: hops until the window comes (three here), then the window mark fades in.
  function launch(t) {
    const ai = t.querySelector(".ai");
    let ind = t.querySelector(".ind");
    if (!ind) {
      ind = Object.assign(document.createElement("span"), { className: "ind new", innerHTML: "<u></u>" });
      t.append(ind);
    }
    const hops = run(ai, [[0, ty(0), out], [200, ty(-14), inn], [380, ty(0)], [520, ty(0), out], [720, ty(-14), inn], [900, ty(0)], [1040, ty(0), out], [1240, ty(-14), inn], [1420, ty(0)]], 1420);
    const mark = run(ind.querySelector("u"), [[0, { opacity: 0 }], [1420, { opacity: 0 }, out], [1570, { opacity: 1 }]], 1570);
    mark.effect.updateTiming({ fill: "both" });
    return [hops, mark, ind];
  }

  // One loop: a click (or press, hold and release) on Notes; Bounce also launches Calendar.
  function loop(t) {
    const ai = t.querySelector(".ai");
    if (fx.click) return fx.click(ai, t);
    const p = fx.press, r = fx.release, pd = dur(p);
    const steps = [...p.slice(0, -1), [pd, p[p.length - 1][1]], [pd + HOLD, r[0][1], r[0][2]], ...r.slice(1).map(([at, f, e]) => [pd + HOLD + at, f, e])];
    return [run(ai, steps, dur(steps))];
  }
  const tiles = (k) => [document.getElementById("d-z-" + k), document.getElementById("d-" + k)];
  function cycle() {
    const anims = tiles("notes").flatMap((t) => loop(t));
    if (SCREEN === "bounce")
      tiles("calendar").forEach((t) => launch(t).slice(0, 2).forEach((a) => (a.effect.updateTiming({ delay: 900 }), anims.push(a))));
    return anims;
  }

  if (SHOT) {
    const at = +(Q.get("t") || 0);
    const hold = () => cycle().forEach((a) => { a.pause(); a.currentTime = at; });
    document.fonts.ready.then(() => requestAnimationFrame(hold));
  } else {
    let last = [];
    const again = () => {
      last.forEach((a) => a.cancel());
      document.querySelectorAll(".ind.new").forEach((i) => i.remove());
      last = cycle();
      Promise.all(last.map((a) => a.finished.catch(() => {}))).then(() => setTimeout(again, 1100));
    };
    setTimeout(again, 400);

    // The pointer: any tile plays the animation; an app with no window launches.
    document.querySelectorAll(".dt").forEach((t) => {
      const ai = t.querySelector(".ai");
      let held = null;
      t.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        if (fx.press) {
          t.getAnimations({ subtree: true }).forEach((a) => a.cancel());
          held = run(ai, fx.press, dur(fx.press));
          held.effect.updateTiming({ fill: "forwards" });
        }
      });
      const up = () => {
        if (!held) return;
        held.cancel();
        held = null;
        run(ai, fx.release, dur(fx.release));
      };
      t.addEventListener("pointerup", up);
      t.addEventListener("pointerleave", up);
      t.addEventListener("click", () => {
        const calendar = t.id.endsWith("calendar");
        const starting = SCREEN === "bounce" && !calendar && !["run", "launch", "fld", "trash"].some((c) => t.classList.contains(c));
        if (starting) {
          t.getAnimations({ subtree: true }).forEach((a) => a.cancel());
          const [hops, , ind] = launch(t);
          ind.classList.remove("new");
          hops.finished.then(() => t.classList.add("run"));
        } else if (fx.click) {
          fx.click(ai, t);
        }
      });
    });
  }
</script>
</body>
</html>

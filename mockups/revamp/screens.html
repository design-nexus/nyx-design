<body>

<script>document.write(`<script src="apps/${APP}.js"><\/script>`);</script>
<script>
  const DEF = APPS[APP];
  Object.assign(KI, DEF.icons || {});
  if (DEF.accent) ROOT.style.setProperty("--app-accent", `var(--sw-${DEF.accent})`);
  ROOT.dataset.screens = Object.keys(DEF.pages).join(",");
  mount((DEF.pages[SCREEN] || Object.values(DEF.pages)[0])());

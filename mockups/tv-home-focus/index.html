<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nyx TV · Home focus strip</title>
<link rel="stylesheet" href="../polish/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 400 13px/1.45 Inter, sans-serif; padding: 32px 40px 60px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.015em; }
  h2 { font-size: 17px; font-weight: 600; margin: 34px 0 4px; }
  p { color: var(--dim-text); max-width: 900px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 18px; margin-top: 14px; }
  figure { margin: 0; }
  figure a { display: block; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
  figure img { display: block; width: 100%; }
  figcaption { margin-top: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  figcaption b { font-weight: 600; }
  figcaption span { color: var(--dim-text); font-size: 12px; }
  figcaption a { margin-left: auto; color: var(--accent); font-size: 12px; text-decoration: none; }
  .theme { display: flex; gap: 6px; margin-top: 14px; }
  .theme a { padding: 5px 12px; border-radius: 7px; color: var(--dim-text); text-decoration: none; background: color-mix(in srgb, var(--text) 3.5%, transparent); }
  .theme a.on { background: var(--accent); color: var(--on-accent); }
  .viewer { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: color-mix(in srgb, #000 88%, transparent); color: #eee; }
  .viewer.on { display: flex; }
  .viewer .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 64px 0; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 20px 60px rgba(0,0,0,.6); }
  .viewer .bar { height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 24px; font-size: 13px; }
  .viewer .bar b { font-weight: 600; }
  .viewer .bar .sub { color: #aaa; }
  .viewer .bar .keys { margin-left: auto; color: #888; font-size: 12px; }
  .viewer .bar .n { color: #888; font-feature-settings: "tnum"; }
  .viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; border-radius: 10px; background: rgba(255,255,255,.08); color: #fff; font-size: 26px; cursor: pointer; }
  .viewer .nav:hover { background: rgba(255,255,255,.16); }
  .viewer .prev { left: 12px; } .viewer .next { right: 12px; }
  .viewer .close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<h1>Home focus strip</h1>
<p>What to show in the top area when a collection, playlist, or app is focused. Pick one layout for
lists (A / B / C) and one for apps (1 / 2 / 3). Click a shot for full size; ← → step through every
shot; D / L switch dark and light.</p>
<div class="theme" id="theme"></div>
<div id="out"></div>
<script>
  const t = new URLSearchParams(location.search).get("theme") || "dark";
  document.documentElement.dataset.theme = t;
  document.getElementById("theme").innerHTML = ["dark", "light"]
    .map((v) => `<a class="${v === t ? "on" : ""}" href="?theme=${v}">${v[0].toUpperCase() + v.slice(1)}</a>`).join("");

  const sections = [
    ["Collections", [
      ["list-collection-a", "A · Identity", "Eyebrow, title, count, summary; hold last movie backdrop", "kind=collection&variant=a"],
      ["list-collection-b", "B · Poster rail", "Identity plus 3–4 child posters", "kind=collection&variant=b"],
      ["list-collection-c", "C · First-title hero", "First child’s art as hero; list name as eyebrow", "kind=collection&variant=c"],
    ]],
    ["Playlists", [
      ["list-playlist-a", "A · Identity", "Same as collections A", "kind=playlist&variant=a"],
      ["list-playlist-b", "B · Poster rail", "Same as collections B", "kind=playlist&variant=b"],
      ["list-playlist-c", "C · First-title hero", "Same as collections C", "kind=playlist&variant=c"],
    ]],
    ["Apps", [
      ["app-1", "1 · App identity", "APP eyebrow, name, Open — no titles from the app", "kind=app&variant=1"],
      ["app-2", "2 · Plex titles", "Plex shows Continue Watching; other apps use identity", "kind=app&variant=2"],
      ["app-3", "3 · Hold featured", "Today’s behavior — last media title stays", "kind=app&variant=3"],
    ]],
  ];

  document.getElementById("out").innerHTML = sections.map(([title, shots]) =>
    `<h2>${title}</h2><div class="grid">${shots.map(([s, name, sub, q]) => {
      const img = `shots/${s}-${t}.png`;
      return `<figure><a href="${img}" data-shot="${s}" data-name="${name}" data-sub="${sub}"><img src="${img}" loading="lazy" alt="${name}"></a><figcaption><b>${name}</b><span>${sub}</span><a href="screens.html?${q}&theme=${t}">live</a></figcaption></figure>`;
    }).join("")}</div>`
  ).join("");

  const shots = [...document.querySelectorAll("a[data-shot]")];
  let at = -1, theme = t;
  const v = document.createElement("div");
  v.className = "viewer";
  v.innerHTML = `<div class="stage"><img alt=""></div><button class="nav prev" title="Previous (←)">‹</button><button class="nav next" title="Next (→)">›</button><button class="close" title="Close (Esc)">×</button>
    <div class="bar"><span class="n"></span><b></b><span class="sub"></span><span class="keys">← → next and previous · D dark · L light · Esc close</span></div>`;
  document.body.append(v);
  const show = (i) => {
    at = (i + shots.length) % shots.length;
    const a = shots[at];
    v.querySelector("img").src = `shots/${a.dataset.shot}-${theme}.png`;
    v.querySelector(".n").textContent = `${at + 1} / ${shots.length}`;
    v.querySelector("b").textContent = a.dataset.name;
    v.querySelector(".sub").textContent = `${a.dataset.sub} · ${theme === "dark" ? "Nyx Dark" : "Nyx Light"}`;
    v.classList.add("on");
  };
  const close = () => { v.classList.remove("on"); at = -1; };
  shots.forEach((a, i) => a.addEventListener("click", (e) => { e.preventDefault(); show(i); }));
  v.querySelector(".prev").onclick = () => show(at - 1);
  v.querySelector(".next").onclick = () => show(at + 1);
  v.querySelector(".close").onclick = close;
  v.querySelector(".stage").onclick = (e) => { if (e.target === e.currentTarget) close(); };
  document.addEventListener("keydown", (e) => {
    if (at < 0) return;
    if (e.key === "ArrowRight" || e.key === " ") show(at + 1);
    else if (e.key === "ArrowLeft") show(at - 1);
    else if (e.key === "Escape") close();
    else if (e.key === "d" || e.key === "l") { theme = e.key === "d" ? "dark" : "light"; show(at); }
    else return;
    e.preventDefault();
  });
</script>
</body>
</html>

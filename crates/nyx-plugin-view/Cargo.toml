[package]
name = "nyx-plugin-view"
version = "0.1.0"
description = "Draws Nyx plugin views with GTK: layout trees, scoped plugin CSS, vector drawings, menus, frames"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-plugin-protocol = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-theme = { path = "../nyx-theme" }
serde_json = "1"

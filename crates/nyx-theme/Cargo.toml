[package]
name = "nyx-theme"
version = "0.1.0"
description = "The GTK4 adapter of Nyx Theme Engine 2.0: the resolved theme as one live stylesheet"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "3e7a6989434466f0cb259028922adbba020d7b3e" }
nyx-theme-core = { path = "../nyx-theme-core", default-features = false }
toml = "1"

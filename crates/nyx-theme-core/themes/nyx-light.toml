# Nyx Light: the light counterpart of Nyx Dark.
# Copy to ~/.config/nyx/themes/nyx-light.toml and keep only the keys to change.
name = "Nyx Light"
light = true

# Core colours
bg = "#ecedf2"
surface = "#f5f6f9"
text = "#171820"
dim_text = "#50546c"
accent = "#136dcd"
border = "#cfd1db"
muted = "#c8cad5"
highlight = "#e0e2ea"
danger = "#cf3434"
glow = "#136dcd"
shadow = "#b6b8c6"

# Surfaces and text
panel = "#e5e6ec"
card = "#f5f6f9"
raised = "#f8f8fb"
popover = "#f8f8fb"
text_tertiary = "#6a6e90"
divider = "#dadce4"
warning = "#a87012"
success = "#2f9a33"

# How strongly the accent tints hovered and selected rows (0 to 1)
hover = 0.05
selection = 0.14

# Default accent per app and per section: a swatch name or a colour.
# Placeholders; each app's Accent row lets the user pick
[accents]
files = "blue"
notes = "amber"
photos = "coral"
mail = "violet"
calendar = "red"
music = "pink"
lyra = "violet"
home = "green"

# Accent choices offered in each app's settings (same names in every theme)
[swatches]
blue = "#136dcd"
violet = "#6a4fd0"
pink = "#aa41a8"
red = "#cf3434"
coral = "#c9532a"
amber = "#a87012"
green = "#2f9a33"
teal = "#14869a"
graphite = "#50546c"

[sections.settings]
home = "teal"
connections = "blue"
hardware = "amber"
personalization = "violet"
desktop = "pink"
input = "coral"
accounts = "green"
assistant = "teal"
system = "red"

# Each app's sidebar groups after the first (nyx_ui::sidebar::set_section); the first
# takes the app's accent, and headings from accounts take rotating swatches.
[sections.git]
branches = "violet"
remotes = "green"
tags = "amber"
stashes = "pink"

[sections.mail]
pinned = "amber"

[sections.chat]
models = "violet"
library = "green"
pinned = "amber"
folders = "teal"
chats = "coral"

# Font names, preferred first: Inter goes by different names depending on how it was installed
[font]
ui = "Inter, Inter Variable, Inter 18pt"
mono = "JetBrains Mono"
weight = 400
heading_weight = 600

[shape]
radius_small = 7
radius_card = 11
radius_dialog = 15

[material]
surface = "solid"
see_through = false
blended = true

[icons]
pack = "nyx-icons"
# File-type icons keep their brand colours ("brand") or take the theme's ("theme")
file_colors = "brand"

# Code colours: swatch names or colours
[syntax]
keyword = "violet"
string = "green"
constant = "amber"
type = "teal"
preprocessor = "coral"

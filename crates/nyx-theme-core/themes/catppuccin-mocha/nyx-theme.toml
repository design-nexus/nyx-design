# Catppuccin Mocha, the NyxOS default theme.
# Palette: catppuccin/palette v1.8.0 (palette.json, "mocha"), MIT, see LICENSE.
# The palette is used as published; only the mapping onto Nyx roles is Nyx's.
schema = 2
id = "catppuccin-mocha"
name = "Catppuccin Mocha"
author = "Catppuccin"
description = "Soothing pastels on the darkest Catppuccin flavour. The NyxOS default."
version = "1.8.0"
appearance = "dark"
license = "MIT"
homepage = "https://catppuccin.com"

[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[tokens]
"surface.primary" = "palette.base"
"surface.secondary" = "palette.mantle"
"surface.tertiary" = "palette.surface0"
"surface.elevated" = "palette.surface1"
"surface.overlay" = "palette.mantle"
"surface.alternate" = "palette.mantle"
"surface.inverse" = "palette.text"
"text.primary" = "palette.text"
"text.secondary" = "palette.subtext0"
"text.tertiary" = "palette.overlay1"
"text.disabled" = "palette.overlay0"
"text.inverse" = "palette.base"
"text.onAccent" = "palette.crust"
"border.default" = "palette.surface1"
"border.subtle" = "palette.surface0"
"border.strong" = "palette.surface2"
"border.focus" = "palette.lavender"
"accent.primary" = "palette.blue"
"accent.secondary" = "palette.lavender"
"state.selected" = "palette.surface0"
"status.success" = "palette.green"
"status.warning" = "palette.yellow"
"status.error" = "palette.red"
"status.info" = "palette.sky"
"shadow.color" = "palette.crust"
"scrim.color" = "palette.crust"
"selection.background" = "palette.surface2"
"selection.foreground" = "palette.text"

[typography]
ui = "Inter, Inter Variable, Inter 18pt"
mono = "JetBrains Mono"
weight = 400
heading_weight = 600

[geometry]
radius_small = 7
radius_card = 11
radius_dialog = 15

[effects]
surface = "solid"
see_through = false
blended = true
hover = 0.07
selection = 0.18

[swatches]
blue = "palette.blue"
violet = "palette.mauve"
pink = "palette.pink"
red = "palette.red"
coral = "palette.peach"
amber = "palette.yellow"
green = "palette.green"
teal = "palette.teal"
graphite = "palette.overlay2"

[accents]
files = "blue"
notes = "amber"
photos = "coral"
mail = "violet"
calendar = "red"
music = "pink"
home = "green"

[sections.settings]
home = "teal"
connections = "blue"
hardware = "amber"
personalization = "violet"
desktop = "pink"
input = "coral"
accounts = "green"
assistant = "teal"
system = "red"

[syntax]
keyword = "violet"
string = "green"
constant = "coral"
type = "amber"
preprocessor = "pink"

[icons]
pack = "nyx-icons"
file_colors = "brand"

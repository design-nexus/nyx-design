[package]
name = "nyx-theme-core"
version = "0.2.0"
description = "Nyx Theme Engine 2.0: theme schema, resolution, registry, configuration, installer and change notifications, without GTK"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["dbus"]
# Emitting and receiving `ThemeChanged` and calling the theme service with zbus. GTK
# apps leave it off and use GIO's D-Bus instead.
dbus = ["dep:zbus"]

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "47c5e0f328b4042df4c08fc317510644a64d1124", default-features = false }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "2c051e628af5582516ece1a8790882328194c26b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[dev-dependencies]
tempfile = "3"

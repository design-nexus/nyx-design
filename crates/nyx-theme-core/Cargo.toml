[package]
name = "nyx-theme-core"
version = "0.2.0"
description = "Nyx Theme Engine 2.0: theme schema, resolution, registry, configuration, installer and change notifications, without GTK"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["dbus"]
# Emitting and receiving `ThemeChanged` and calling the theme service with zbus. GTK
# apps leave it off and use GIO's D-Bus instead.
dbus = ["dep:zbus"]

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa", default-features = false }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[dev-dependencies]
tempfile = "3"

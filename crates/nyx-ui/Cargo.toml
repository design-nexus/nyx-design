[package]
name = "nyx-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-theme = { path = "../nyx-theme" }
# The window action table and Shell Core's protocol, shared with the shell.
nyx-shell-proto = { git = "https://github.com/nyxos-project/nyx-shell.git", rev = "a47b95353f3f11b8012fb2ce398296e1f3b12d9e" }
serde_json = "1"
toml = "1"

[package]
name = "nyx-theme-cli"
version = "0.2.0"
description = "The nyx-theme command: list, choose, install, update, remove and check Nyx themes"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-theme"
path = "src/main.rs"

[features]
default = ["dbus"]
dbus = ["nyx-theme-core/dbus"]

[dependencies]
nyx-theme-core = { path = "../nyx-theme-core", default-features = false }
serde = "1"
serde_json = "1"
